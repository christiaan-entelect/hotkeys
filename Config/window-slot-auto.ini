; Window slot auto-assignment rules
; Priority: app rule > currently active slot > no assignment
; Uncomment/edit rules below to enable them.

[settings]
enabled=1

; Simple executable match (case-insensitive)
;[Chrome]
;type=exe
;match=Chrome.exe
;slot=c

;[VS Code]
;type=exe
;match=Code.exe
;slot=w

; Full WinTitle criteria (same syntax as #HotIf / WinExist)
;[Explorer]
;type=wintitle
;match=ahk_class CabinetWClass
;slot=f
